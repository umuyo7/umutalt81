<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mutfak Fişi · {{ table.display_name }}</title>
<style>@page{size:80mm auto;margin:3mm}*{box-sizing:border-box}body{width:74mm;margin:0 auto;color:#000;background:#fff;font:14px/1.25 ui-monospace,monospace}.receipt{text-align:center}.receipt h1{font-size:22px;margin:4px 0}.meta{border-block:2px dashed #000;padding:8px 0;margin:8px 0;text-align:left}.items{text-align:left}.item{padding:8px 0;border-bottom:1px dashed #000}.item strong{font-size:18px}.note{display:block;font-weight:700;margin-top:4px}.actions{display:flex;gap:8px;margin:14px 0}.actions button,.actions a{flex:1;border:1px solid #000;padding:10px;background:#fff;color:#000;text-decoration:none;font:700 13px sans-serif}@media print{.actions{display:none}body{width:auto}}</style></head>
<body><main class="receipt"><h1>MUTFAK</h1><div class="meta"><strong>Masa:</strong> {{ table.display_name }}<br><strong>Garson:</strong> {{ waiter.name }}<br><strong>Saat:</strong> {{ sent_at.strftime('%d.%m.%Y %H:%M') }}<br><strong>Adisyon:</strong> {{ check.check_number }}</div><section class="items">{% for item in items %}<div class="item"><strong>{{ item.quantity }} × {{ item.product_name_snapshot }}</strong>{% if item.note %}<span class="note">NOT: {{ item.note }}</span>{% endif %}</div>{% endfor %}</section><div class="actions"><button onclick="window.print()">Yazdır</button><a href="{{ app_prefix }}/pos/masa/{{ table.id }}">Masaya dön</a></div></main><script>window.addEventListener('load',()=>window.print())</script></body></html>
